spring:
  application:
    name: nook-cafe-be
  datasource:
    url: jdbc:postgresql://localhost:5432/nook_cafe
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
